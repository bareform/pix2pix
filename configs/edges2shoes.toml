[dataset]
dataset = "edges2shoes"

[model]
generator_in_channels = [64, 128, 256, 512, 512, 512, 512]
discriminator_in_channels = [64, 128, 256, 512]

[training]
batch_size = 4
num_workers = 4
pin_memory = true
num_epochs = 25

image_height = 256
image_width = 256

generator_lr = 0.0002
generator_adam_beta1 = 0.5
generator_adam_beta2 = 0.999

discriminator_lr = 0.000001
discriminator_adam_beta1 = 0.5
discriminator_adam_beta2 = 0.999

pixel_loss_weight = 100.0

mixed_precision = "fp16"
random_seed = 0

[evaluation]
checkpoint_dir = "./checkpoints"
save_checkpoint_interval = 200

output_dir = "./output"
save_output_interval = 1

nrow = 1